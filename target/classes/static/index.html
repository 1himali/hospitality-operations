<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hospitality Operations Management System - Room and Menu Management Dashboard">
    <title>Hospitality Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="brand-text">HospOps</span>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="rooms" id="nav-rooms">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 20v-8l10-6 10 6v8"/>
                        <path d="M4 20V11"/>
                        <path d="M20 20V11"/>
                        <rect x="6" y="14" width="4" height="6"/>
                        <rect x="14" y="14" width="4" height="6"/>
                    </svg>
                    <span>Rooms</span>
                </button>
                <button class="nav-item" data-page="menu" id="nav-menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                        <line x1="6" y1="1" x2="6" y2="4"/>
                        <line x1="10" y1="1" x2="10" y2="4"/>
                        <line x1="14" y1="1" x2="14" y2="4"/>
                    </svg>
                    <span>Menu</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-footer-info">
                    <span class="sidebar-footer-dot"></span>
                    <span>System Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebar-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <line x1="3" y1="12" x2="21" y2="12"/>
                            <line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <h1 class="page-title" id="page-title">Room Management</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-clock" id="topbar-clock"></div>
                </div>
            </header>

            <!-- Pages -->
            <div class="page-container">
                <!-- Rooms Page -->
                <section class="page active" id="page-rooms">
                    <!-- Stats Row -->
                    <div class="stats-row" id="room-stats"></div>

                    <!-- Toolbar -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="filter-group">
                                <label class="filter-label">Status</label>
                                <select class="filter-select" id="room-status-filter">
                                    <option value="">All Statuses</option>
                                    <option value="VACANT">Vacant</option>
                                    <option value="OCCUPIED">Occupied</option>
                                    <option value="RESERVED">Reserved</option>
                                    <option value="MAINTAINED">Maintained</option>
                                    <option value="UNDER_MAINTENANCE">Under Maintenance</option>
                                    <option value="MAINT">Maint</option>
                                </select>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-primary" id="btn-add-room">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Add Room
                            </button>
                        </div>
                    </div>

                    <!-- Room Grid -->
                    <div class="card-grid" id="room-grid">
                        <div class="loading-state">Loading rooms...</div>
                    </div>
                </section>

                <!-- Menu Page -->
                <section class="page" id="page-menu">
                    <!-- Stats Row -->
                    <div class="stats-row" id="menu-stats"></div>

                    <!-- Toolbar -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="filter-group">
                                <label class="filter-label">Category</label>
                                <select class="filter-select" id="menu-category-filter">
                                    <option value="">All Categories</option>
                                    <option value="STARTERS">Starters</option>
                                    <option value="MAINS">Mains</option>
                                    <option value="SIDES">Sides</option>
                                    <option value="DESSERTS">Desserts</option>
                                    <option value="BEVERAGES">Beverages</option>
                                </select>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn btn-primary" id="btn-add-menu-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Add Item
                            </button>
                        </div>
                    </div>

                    <!-- Menu Grid -->
                    <div class="card-grid" id="menu-grid">
                        <div class="loading-state">Loading menu items...</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Room Modal -->
    <div class="modal-overlay" id="room-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="room-modal-title">Add Room</h2>
                <button class="modal-close" id="room-modal-close">&times;</button>
            </div>
            <form id="room-form" class="modal-form">
                <input type="hidden" id="room-edit-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="room-number">Room Number *</label>
                        <input type="text" id="room-number" maxlength="10" required placeholder="e.g. 101">
                    </div>
                    <div class="form-group">
                        <label for="room-type">Type *</label>
                        <select id="room-type" required>
                            <option value="DELUXE_KING">Deluxe King</option>
                            <option value="STD_DOUBLE">Standard Double</option>
                            <option value="SUITE">Suite</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="room-floor">Floor *</label>
                        <input type="number" id="room-floor" min="0" required placeholder="e.g. 1">
                    </div>
                    <div class="form-group">
                        <label for="room-rate">Rate / Night (₹) *</label>
                        <input type="number" id="room-rate" min="0.01" step="0.01" required placeholder="e.g. 4500.00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="room-status-input">Status</label>
                        <select id="room-status-input">
                            <option value="VACANT">Vacant</option>
                            <option value="OCCUPIED">Occupied</option>
                            <option value="RESERVED">Reserved</option>
                            <option value="MAINTAINED">Maintained</option>
                            <option value="UNDER_MAINTENANCE">Under Maintenance</option>
                            <option value="MAINT">Maint</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="room-image-url">Image URL</label>
                        <input type="url" id="room-image-url" placeholder="https://...">
                    </div>
                </div>
                <div class="form-group">
                    <label for="room-issue-notes">Issue Notes</label>
                    <textarea id="room-issue-notes" rows="2" maxlength="500" placeholder="Any maintenance notes..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost" id="room-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="room-submit-btn">Save Room</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="modal-overlay" id="menu-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="menu-modal-title">Add Menu Item</h2>
                <button class="modal-close" id="menu-modal-close">&times;</button>
            </div>
            <form id="menu-form" class="modal-form">
                <input type="hidden" id="menu-edit-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="menu-name">Name *</label>
                        <input type="text" id="menu-name" maxlength="150" required placeholder="e.g. Paneer Tikka">
                    </div>
                    <div class="form-group">
                        <label for="menu-category">Category *</label>
                        <select id="menu-category" required>
                            <option value="STARTERS">Starters</option>
                            <option value="MAINS">Mains</option>
                            <option value="SIDES">Sides</option>
                            <option value="DESSERTS">Desserts</option>
                            <option value="BEVERAGES">Beverages</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="menu-price">Price (₹) *</label>
                        <input type="number" id="menu-price" min="0.01" step="0.01" required placeholder="e.g. 350.00">
                    </div>
                    <div class="form-group form-group-toggle">
                        <label for="menu-available">Available</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="menu-available" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-ghost" id="menu-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="menu-submit-btn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Delete</h2>
                <button class="modal-close" id="delete-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="delete-modal-message">Are you sure you want to delete this item?</p>
            </div>
            <div class="form-actions">
                <button class="btn btn-ghost" id="delete-modal-cancel">Cancel</button>
                <button class="btn btn-danger" id="delete-modal-confirm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
</body>
</html>
